apply plugin: 'maven-publish'
apply plugin: 'signing'

ext.isReleaseVersion = !version.endsWith("SNAPSHOT")

task androidJavadocs(type: Javadoc) {
    failOnError false
    source = android.sourceSets.main.java.sourceFiles
    classpath += project.files(android.getBootClasspath().join(File.pathSeparator))

    if (JavaVersion.current().isJava8Compatible()) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
    if (JavaVersion.current().isJava9Compatible()) {
        options.addBooleanOption('html5', true)
    }

    options.encoding = "UTF-8"
    options.docTitle("PdfBox-Android")
    options.links("https://docs.oracle.com/en/java/javase/11/docs/api")
    options.links("https://developer.android.com/reference/")

    exclude '**/BuildConfig.java'
    exclude '**/R.java'
}

afterEvaluate {
    androidJavadocs.classpath += files(android.libraryVariants.collect { variant ->
        variant.javaCompileProvider.get().classpath.files
    })
}

task androidJavadocsJar(type: Jar, dependsOn: androidJavadocs) {
    archiveClassifier.set('javadoc')
    from androidJavadocs.destinationDir
}

task androidSourcesJar(type: Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

def pomConfig = {
    url "https://github.com/idineshgovind/PdfBox-Android"
    licenses {
        license {
            name "The Apache Software License, Version 2.0"
            url "http://www.apache.org/licenses/LICENSE-2.0.txt"
            distribution "repo"
        }
    }
    developers {
        developer {
            id "idineshgovind"
            name "Dinesh G"
            url "https://github.com/idineshgovind"
        }
    }
    scm {
        connection "scm:git:git://github.com/idineshgovind/PdfBox-Android.git"
        developerConnection "scm:git:ssh://git@github.com/idineshgovind/PdfBox-Android.git"
        url "https://github.com/idineshgovind/PdfBox-Android"
    }
}

project.afterEvaluate {
    publishing {
        repositories {
            maven {
                name = 'central'
                url = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
                credentials {
                    username = project.hasProperty('ossrhUsername') ? ossrhUsername : System.getenv('OSSRH_USERNAME')
                    password = project.hasProperty('ossrhPassword') ? ossrhPassword : System.getenv('OSSRH_PASSWORD')
                }
            }
        }
        publications {
            maven(MavenPublication) {
                artifact bundleReleaseAar
                artifact androidJavadocsJar
                artifact androidSourcesJar

                groupId project.PUBLISH_GROUP_ID
                artifactId project.PUBLISH_ARTIFACT_ID
                version project.PUBLISH_VERSION

                pom.withXml {
                    def root = asNode()
                    root.appendNode('name', 'PdfBox-Android')
                    root.appendNode('description', 'A security-hardened fork of PdfBox-Android — the Apache PdfBox project ported to work on Android')
                    root.children().last() + pomConfig

                    def dependenciesNode = asNode().appendNode('dependencies')
                    configurations.api.allDependencies.each {
                        def dependencyNode = dependenciesNode.appendNode('dependency')
                        dependencyNode.appendNode('groupId', it.group)
                        dependencyNode.appendNode('artifactId', it.name)
                        dependencyNode.appendNode('version', it.version)
                    }
                }
            }
        }
    }

    signing {
        def signingKeyId = findProperty("signingKeyId")
        def signingKey = findProperty("signingKey")
        def signingPassword = findProperty("signingPassword")
        useInMemoryPgpKeys(signingKeyId, signingKey, signingPassword)
        sign publishing.publications.maven
    }
}

// After publishing, finalize the deployment on Central Portal
task finalizeDeployment {
    description = 'Triggers the Central Portal to pick up the deployment from the OSSRH Staging API'
    dependsOn 'publishMavenPublicationToCentralRepository'
    doLast {
        def username = project.hasProperty('ossrhUsername') ? ossrhUsername : System.getenv('OSSRH_USERNAME')
        def password = project.hasProperty('ossrhPassword') ? ossrhPassword : System.getenv('OSSRH_PASSWORD')
        def token = "${username}:${password}".bytes.encodeBase64().toString()
        def namespace = project.PUBLISH_GROUP_ID

        def url = new URL("https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/${namespace}?publishing_type=automatic")
        def conn = url.openConnection()
        conn.setRequestMethod('POST')
        conn.setRequestProperty('Authorization', "Bearer ${token}")
        conn.setRequestProperty('Content-Length', '0')
        conn.setDoOutput(true)
        conn.getOutputStream().close()

        def code = conn.getResponseCode()
        if (code >= 200 && code < 300) {
            println "Deployment finalized successfully (HTTP ${code}). It will appear at https://central.sonatype.com/publishing/deployments"
        } else {
            def body = conn.getErrorStream()?.text ?: conn.getInputStream()?.text ?: ''
            println "WARNING: Finalize returned HTTP ${code}: ${body}"
            println "You may need to manually release at https://central.sonatype.com/publishing/deployments"
        }
    }
}
